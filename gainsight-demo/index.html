<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="description" content="GainSight demo video — route-aware spatial audio for nonvisual indoor navigation. A research project by Yihang Zou and collaborators.">
  <link rel="canonical" href="https://bbbxdjc.github.io/gainsight-demo/">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css?v=dd1bb9c9">
  <title>GainSight · Demo Video | Yihang Zou</title>
  <style>
    .demo-page{max-width:960px;padding-block:38px 30px}
    .demo-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
    .demo-heading .eyebrow,.demo-heading .publication-badge{margin:0}
    .demo-page h1{font-family:var(--serif);font-size:46px;line-height:1.15;letter-spacing:-1.5px;margin:12px 0}
    .demo-subtitle{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 23px;max-width:750px}
    .demo-player{background:#1f2523;border:1px solid var(--line);padding:0;overflow:hidden}
    .demo-player video{display:block;width:100%;aspect-ratio:16/9;max-height:62vh;object-fit:contain;background:#1f2523}
    .demo-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:15px;border-bottom:1px solid var(--line);font-size:12px}
    .demo-toolbar p{color:var(--muted);margin:0}
    .demo-toolbar a,.demo-return{color:var(--accent)}
    .demo-return{display:inline-block;margin-top:20px;font-size:13px}
    .demo-header-home{font-size:13px;color:var(--accent)}
    @media(max-width:760px){.demo-page{padding-top:27px}.demo-page h1{font-size:38px}.demo-heading{align-items:flex-start;gap:10px}.demo-heading .eyebrow{font-size:9px}.demo-subtitle{font-size:13px}.demo-toolbar{align-items:flex-start;font-size:11px}.demo-header-home{font-size:12px}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to video</a>
  <header class="site-header"><div class="header-inner"><a class="wordmark" href="../" aria-label="Yihang Zou, homepage">Yihang Zou<span class="wordmark-dot">.</span></a><a class="demo-header-home" href="../">← Homepage</a></div></header>
  <main class="demo-page container" id="main">
    <div class="demo-heading"><p class="eyebrow">GAINSIGHT / DEMO VIDEO</p><span class="publication-badge manuscript-badge">Submitted to CHI</span></div>
    <h1>GainSight</h1>
    <p class="demo-subtitle">Designing Route-Aware Spatial Audio for Nonvisual Indoor Route Guidance</p>
    <div class="demo-player"><video controls playsinline preload="metadata" width="1280" height="720" poster="../assets/gainsight-overview.png" aria-label="GainSight demonstration video"><source src="../assets/gainsight-demo.mp4" type="video/mp4">Your browser does not support embedded video. <a href="../assets/gainsight-demo.mp4">Open the demo video.</a></video></div>
    <div class="demo-toolbar"><p>4 min 42 sec · 720p · Play to hear audio</p><a href="../assets/gainsight-demo.mp4">Open video file ↗</a></div>
    <a class="demo-return" href="../#gainsight">← Back to the GainSight project</a>
  </main>
</body>
</html>
